version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-todolist}
      POSTGRES_USER: ${DB_USERNAME:-todolist}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-todolist}
    volumes:
      - todolist-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-todolist}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-todolist}
      DB_USERNAME: ${DB_USERNAME:-todolist}
      DB_PASSWORD: ${DB_PASSWORD:-todolist}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PORT: 8080
    ports:
      - "8080:8080"

volumes:
  todolist-db-data:
